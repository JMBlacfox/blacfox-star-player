<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blacfox Media Advisor</title>
<style>
:root{
  --bg:#101010; --panel:#181818; --panel2:#232323; --border:#383838; --soft:#303030;
  --text:#f7f7f5; --sub:#b7b7b2; --accent:#ef661f; --accent2:#ff9a3d; --accent3:#ffc078;
  --warn:#e8a33d; --good:#3fbf7f; --bad:#e05d5d; --radius:16px;
  --shadow:0 22px 60px rgba(6,12,20,.38);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f4f1; --panel:#ffffff; --panel2:#f0efeb; --border:#dedbd4; --soft:#e4e1da;
    --text:#181818; --sub:#686863; --accent:#df581b; --accent2:#ed822d; --accent3:#b64a18;
    --shadow:0 18px 42px rgba(15,23,42,.08);
  }
}
:root[data-theme="dark"]{ --bg:#101010; --panel:#181818; }
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(circle at top left, rgba(239,102,31,.18), transparent 28%),
    radial-gradient(circle at bottom right, rgba(255,154,61,.11), transparent 24%),
    var(--bg);
  color:var(--text); padding:28px 18px 60px; line-height:1.5;
}
.page-shell{max-width:1040px; margin:0 auto;}
.app-header{
  display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
  margin-bottom:10px; padding:6px 4px 0;
}
.eyebrow{
  display:inline-flex; align-items:center; gap:8px; padding:5px 10px; border-radius:999px;
  background:rgba(239,102,31,.12); border:1px solid rgba(239,102,31,.34); color:var(--accent3);
  font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; font-weight:700;
  margin-bottom:10px;
}
.eyebrow::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px rgba(239,102,31,.9);}
h1{font-size:clamp(2rem, 3vw, 2.5rem); line-height:1.1; margin:0; letter-spacing:-.04em;}
.sub{
  color:var(--sub); margin:0 0 22px; font-size:.92rem; letter-spacing:.01em;
}
.header-badge{
  background:var(--panel); border:1px solid var(--border); border-radius:999px;
  padding:8px 12px; font-size:.72rem; font-weight:700; color:var(--sub); box-shadow:var(--shadow);
}
.steps{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
.step-pill{
  font-size:.68rem; padding:7px 10px; border-radius:999px; border:1px solid var(--border);
  color:var(--sub); background:rgba(16,24,39,.72); backdrop-filter:blur(6px);
  letter-spacing:.02em; transition:all .16s ease; cursor:pointer; font:inherit;
}
.step-pill:hover{transform:translateY(-1px); border-color:rgba(239,102,31,.75); color:var(--text);}
.step-pill.active{
  background:linear-gradient(135deg, var(--accent), var(--accent2)); border-color:transparent;
  color:#fff; font-weight:700; box-shadow:0 10px 24px rgba(239,102,31,.3);
}
.step-pill.done{border-color:rgba(255,154,61,.55); color:var(--accent2); background:rgba(255,154,61,.08);}
.panel{
  background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)), var(--panel);
  border:1px solid var(--border); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow);
}
.panel h2{margin:0 0 6px; font-size:1.25rem; letter-spacing:-.025em;}
.panel .hint{color:var(--sub); font-size:.88rem; margin:0 0 18px;}
textarea{
  width:100%; min-height:110px; background:var(--panel2); border:1px solid var(--border);
  border-radius:12px; color:var(--text); padding:14px 14px; font-size:.93rem; font-family:inherit;
  resize:vertical; transition:border-color .12s ease, box-shadow .12s ease;
}
textarea:focus, input[type=text]:focus, input[type=number]:focus, input[type=date]:focus, select:focus{
  outline:none; border-color:rgba(239,102,31,.75); box-shadow:0 0 0 4px rgba(239,102,31,.12);
}
input[type=text], input[type=number], input[type=date], select{
  background:var(--panel2); border:1px solid var(--border); border-radius:10px; color:var(--text);
  padding:10px 12px; font-size:.88rem; font-family:inherit; width:100%; transition:border-color .12s ease, box-shadow .12s ease;
}
.choice-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px;}
.choice-btn{
  position:relative; background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)), var(--panel2);
  border:1px solid var(--border); color:var(--text); padding:16px 14px; border-radius:12px;
  cursor:pointer; text-align:left; font-size:.9rem; font-weight:700; line-height:1.35;
  transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease, background .12s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
}
.choice-btn:hover{transform:translateY(-1px); border-color:rgba(239,102,31,.75); box-shadow:0 10px 20px rgba(14,20,33,.28);}
.choice-btn .desc{display:block; font-weight:400; color:var(--sub); font-size:.76rem; margin-top:5px;}
.choice-btn.selected{
  background:linear-gradient(135deg, var(--accent), var(--accent2)); border-color:transparent; color:#fff;
  box-shadow:0 12px 26px rgba(239,102,31,.26);
}
.choice-btn.selected .desc{color:rgba(255,255,255,.9);}
.choice-btn.recommended{border-color:rgba(255,154,61,.75); box-shadow:0 0 0 1px rgba(255,154,61,.55) inset;}
.rec-badge{
  position:absolute; top:-8px; right:10px; background:var(--accent2); color:#062a2b;
  font-size:.62rem; font-weight:800; padding:2px 7px; border-radius:999px; letter-spacing:.04em;
  box-shadow:0 8px 18px rgba(255,154,61,.25);
}
.rec-note{
  background:rgba(255,154,61,.08); border:1px solid rgba(255,154,61,.3); color:var(--accent2);
  border-radius:12px; padding:12px 14px; font-size:.84rem; margin-bottom:16px;
}
.goal-insight{
  margin-top:14px; padding:15px 16px; border:1px solid rgba(239,102,31,.34);
  border-radius:12px; background:linear-gradient(135deg, rgba(239,102,31,.1), rgba(255,154,61,.06));
  font-size:.85rem; min-height:52px;
}
.goal-insight:empty{display:none;}
.goal-insight .insight-label{
  color:var(--accent3); font-size:.68rem; font-weight:800; letter-spacing:.07em;
  text-transform:uppercase; margin-bottom:5px;
}
.goal-insight strong{color:var(--text);}
.goal-insight .insight-detail{color:var(--sub); margin-top:4px;}
.qcard{background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px;}
.qcard p.q{margin:0 0 10px; font-weight:600; font-size:.92rem;}
.yn{display:flex; gap:8px; margin-bottom:8px;}
.yn button{
  flex:1; padding:9px; border-radius:9px; border:1px solid var(--border); background:var(--panel);
  color:var(--text); cursor:pointer; font-size:.82rem; font-weight:700; transition:all .12s ease;
}
.yn button:hover{border-color:rgba(239,102,31,.7);} 
.yn button.sel-yes{background:linear-gradient(135deg, #1d8e5f, var(--good)); border-color:transparent; color:#fff; box-shadow:0 8px 20px rgba(63,191,127,.22);}
.yn button.sel-no{background:linear-gradient(135deg, #c75959, var(--bad)); border-color:transparent; color:#fff; box-shadow:0 8px 20px rgba(224,93,93,.22);}
.feedback{font-size:.82rem; padding:9px 10px; border-radius:8px; display:none;}
.feedback.show{display:block;}
.feedback.warn{background:rgba(232,163,61,.11); color:var(--warn); border:1px solid rgba(232,163,61,.32);}
.feedback.good{background:rgba(63,191,127,.11); color:var(--good); border:1px solid rgba(63,191,127,.32);}
.readiness{
  margin-top:18px; padding:14px 16px; border-radius:12px; border:1px solid var(--border); background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)), var(--panel2);
  font-size:.86rem;
}
.readiness .score{font-weight:800; font-size:1rem; margin-bottom:4px;}
.nav-row{display:flex; justify-content:space-between; margin-top:22px; gap:12px; align-items:center;}
.btn{
  padding:11px 18px; border-radius:10px; border:1px solid var(--border); background:var(--panel2);
  color:var(--text); cursor:pointer; font-size:.86rem; font-weight:700; transition:all .12s ease;
}
.btn:hover:not(:disabled){transform:translateY(-1px); border-color:rgba(239,102,31,.7);}
.btn.primary{background:linear-gradient(135deg, var(--accent), var(--accent2)); border-color:transparent; color:#fff; box-shadow:0 12px 24px rgba(239,102,31,.22);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
@media (max-width:600px){.grid2{grid-template-columns:1fr;} .choice-grid{grid-template-columns:1fr 1fr;}}
.block{background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:14px;}
.block h4{margin:0 0 8px; font-size:.76rem; text-transform:uppercase; color:var(--sub); letter-spacing:.06em;}
.block ul{margin:0; padding-left:18px; font-size:.87rem;}
.block li{margin-bottom:5px;}
.tips{background:linear-gradient(180deg, rgba(232,163,61,.04), rgba(232,163,61,.02)); border:1px solid rgba(232,163,61,.26); border-radius:12px; padding:14px 16px;}
.tips h4{margin:0 0 8px; font-size:.76rem; text-transform:uppercase; color:var(--warn); letter-spacing:.06em;}
.tips ul{margin:0; padding-left:18px; font-size:.87rem;}
.tips li{margin-bottom:5px;}
.footnote{color:var(--sub); font-size:.74rem; margin-top:16px; border-top:1px solid var(--border); padding-top:10px;}
.tag{display:inline-block; font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--accent2); font-weight:800; margin-bottom:8px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:.75rem; color:var(--sub); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em;}
.field .note{font-size:.72rem; color:var(--sub); margin-top:4px;}
.calc-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:600px){.calc-grid{grid-template-columns:1fr;}}
.result-box{
  background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff;
  border-radius:14px; padding:20px; margin-top:6px; box-shadow:0 16px 30px rgba(239,102,31,.2);
}
.result-box .big{font-size:2.1rem; font-weight:800; letter-spacing:-.04em;}
.result-box .lbl{font-size:.72rem; text-transform:uppercase; opacity:.86; letter-spacing:.06em; margin-bottom:6px;}
.result-row{display:flex; justify-content:space-between; font-size:.82rem; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.25);}
.section-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin:24px 0 12px;}
.section-head:first-of-type{margin-top:4px;}
.section-head h3{margin:0; font-size:1rem; letter-spacing:-.015em;}
.section-head p{margin:3px 0 0; color:var(--sub); font-size:.78rem;}
.section-number{color:var(--accent2); font-size:.68rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase;}
.form-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr));}
.check-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
.check-label{display:flex; align-items:flex-start; gap:9px; padding:11px 12px; border:1px solid var(--border); border-radius:10px; background:var(--panel2); color:var(--text); font-size:.82rem; cursor:pointer;}
.check-label:has(input:checked){border-color:rgba(255,154,61,.7); background:rgba(255,154,61,.08);}
.check-label input{accent-color:var(--accent2); margin-top:3px;}
.mini-card{background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:14px;}
.mini-card h4{margin:0 0 6px; font-size:.76rem; text-transform:uppercase; letter-spacing:.06em; color:var(--sub);}
.mini-card p{margin:0; font-size:.83rem;}
.allocation-row{display:grid; grid-template-columns:minmax(145px,1fr) 110px minmax(110px,1fr); gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);}
.allocation-row:last-child{border-bottom:0;}
.allocation-row strong{font-size:.84rem;}
.allocation-row small{display:block; color:var(--sub); font-size:.7rem; margin-top:2px;}
.allocation-total{display:flex; justify-content:space-between; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); font-size:.84rem; font-weight:800;}
.meter{height:7px; border-radius:999px; background:var(--soft); overflow:hidden; margin-top:7px;}
.meter span{display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .15s ease;}
.status-list{display:grid; gap:8px; margin:0; padding:0; list-style:none;}
.status-list li{display:flex; gap:9px; align-items:flex-start; font-size:.82rem; color:var(--sub);}
.status-list li::before{content:"✓"; color:var(--good); font-weight:800;}
.status-list li.warn::before{content:"!"; color:var(--warn);}
.sequence{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
.sequence-step{position:relative; padding:14px; border:1px solid var(--border); border-radius:12px; background:var(--panel2);}
.sequence-step:not(:last-child)::after{content:"→"; position:absolute; right:-17px; top:35%; color:var(--accent2); font-weight:800; z-index:1;}
.sequence-step .step-num{color:var(--accent2); font-size:.68rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;}
.sequence-step strong{display:block; margin:5px 0 3px; font-size:.86rem;}
.sequence-step span{color:var(--sub); font-size:.76rem;}
.notice{padding:11px 13px; border-radius:10px; border:1px solid rgba(232,163,61,.3); background:rgba(232,163,61,.08); color:var(--warn); font-size:.8rem;}
.approval{display:flex; gap:12px; flex-wrap:wrap;}
.approval .check-label{flex:1; min-width:180px;}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:12px;}
.data-table{width:100%; border-collapse:collapse; font-size:.78rem; min-width:520px;}
.data-table th,.data-table td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--border);}
.data-table th{color:var(--sub); text-transform:uppercase; font-size:.66rem; letter-spacing:.06em; background:var(--panel2);}
.data-table tr:last-child td{border-bottom:0;}
.brief-card{margin-top:18px; padding:18px; border:1px solid rgba(239,102,31,.38); border-radius:14px; background:linear-gradient(135deg, rgba(239,102,31,.1), rgba(255,154,61,.06));}
.brief-card h3{margin:0 0 5px; font-size:1rem;}
.brief-card p{margin:0; color:var(--sub); font-size:.82rem;}
.brief-meta{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0;}
.brief-meta span{padding:5px 9px; border-radius:999px; background:var(--panel2); border:1px solid var(--border); color:var(--sub); font-size:.72rem;}
@media (max-width:700px){.form-grid,.form-grid.three,.check-grid,.sequence{grid-template-columns:1fr 1fr;} .sequence-step:not(:last-child)::after{display:none;} .allocation-row{grid-template-columns:1fr 90px;}.allocation-row .allocation-status{grid-column:1 / -1;}}
@media (max-width:480px){.form-grid,.form-grid.three,.check-grid,.sequence{grid-template-columns:1fr;}}
</style>
</head>
<body>
  <div class="page-shell">
    <header class="app-header">
      <div>
        <div class="eyebrow">Strategy Workspace</div>
        <h1>Blacfox Media Advisor</h1>
      </div>
      <div class="header-badge">Performance planning</div>
    </header>
    <p class="sub">Goal → platform → objective → readiness → format → playbook → CPL estimate.</p>

    <div class="steps" id="steps"></div>
    <div class="panel" id="panel"></div>
  </div>

<script>
const PLATFORMS = [
  {id:"LinkedIn", label:"LinkedIn Ads", keywords:["b2b","enterprise","decision maker","professional","account-based","abm","cio","cfo","procurement","saas","tech buyer"]},
  {id:"TikTok", label:"TikTok Ads", keywords:["gen z","young","viral","trend","short video","brand awareness","reach","mass market","entertainment"]},
  {id:"X", label:"X Ads", keywords:["news","real-time","conversation","thought leadership","tech community","developer","finance","public affairs"]},
  {id:"Google", label:"Google Ads", keywords:["search intent","demand capture","people searching","bottom of funnel","high intent","ready to buy","comparison"]},
  {id:"Meta", label:"Meta Ads", keywords:["broad reach","ecommerce","consumer","retargeting","lookalike","visual","lifestyle","mass audience"]},
  {id:"Teads", label:"Teads", keywords:["premium publisher","brand safe","video reach","outstream","editorial","contextual","cpm efficient reach"]},
  {id:"Netline", label:"Netline", keywords:["content syndication","whitepaper","gated content","intent data","b2b leads","account intent","content download"]},
  {id:"Microsoft", label:"Microsoft Ads", keywords:["enterprise search","desktop","office","linkedin profile targeting","microsoft ecosystem","b2b search"]}
];

const OBJECTIVES = [
  {id:"awareness", label:"Awareness", desc:"Get known by a cold audience", keywords:["awareness","launch","introduce","new product","visibility","reach","brand recognition","don't know us","nobody knows"]},
  {id:"consideration", label:"Consideration / Engagement", desc:"Build interest, content engagement", keywords:["engagement","content","educate","consider","evaluate","thought leadership","video views","interest"]},
  {id:"leadgen", label:"Lead Generation", desc:"Capture contact/demo requests", keywords:["leads","demo","book a call","pipeline","form fill","contact us","mql","sign up","inquiries"]},
  {id:"conversion", label:"Conversion / Sales", desc:"Drive purchase or signup", keywords:["sales","purchase","buy","ecommerce","checkout","signup","revenue","conversion","subscribe"]},
  {id:"retargeting", label:"Retargeting", desc:"Re-engage warm audiences", keywords:["retarget","re-engage","abandoned","came back","warm audience","nurture","website visitors"]}
];

const QUESTIONS = {
  awareness: [
    {q:"Do you have a clear, differentiated message (not just 'we exist')?",
     no:"Awareness spend without a sharp message just buys impressions nobody remembers. Nail the message first.",
     yes:"Good — a clear differentiator is what makes awareness spend stick."},
    {q:"Is your target audience (ICP) narrowly defined, not just 'B2B tech buyers'?",
     no:"Broad targeting on awareness objectives burns budget on people who'll never buy. Tighten the ICP.",
     yes:"Good — narrow ICP means awareness impressions land on people worth remembering you."},
    {q:"Do you have a follow-up plan (retargeting/leadgen) once awareness runs?",
     no:"Awareness with no follow-up is spend with no path to revenue. Plan the next stage before you launch.",
     yes:"Good — awareness into a retargeting/leadgen sequence is the right shape."},
    {q:"Is there budget for sustained frequency over weeks, not a one-off burst?",
     no:"Awareness needs repeated exposure to actually register — a single short burst rarely moves brand recall.",
     yes:"Good — sustained frequency is what actually builds recall."},
    {q:"Do you have a way to measure lift (brand survey, search volume, direct traffic) rather than just impressions?",
     no:"Without a lift measure, you'll have no way to know if awareness spend actually worked. Set this up before launch.",
     yes:"Good — measuring lift means you can prove (or disprove) the spend."}
  ],
  consideration: [
    {q:"Has this audience already been exposed to top-of-funnel/brand content?",
     no:"Consideration content (deep-dives, comparisons, demos) underperforms on a cold audience — they don't have context yet.",
     yes:"Good fit — consideration content works once there's some brand familiarity."},
    {q:"Do you have content assets ready (case studies, demo videos, comparison guides)?",
     no:"Consideration campaigns need substance, not a generic ad — build the asset before you launch spend.",
     yes:"Good — you have something worth someone's attention span."},
    {q:"Do you have a way to track engagement depth (video watch %, time on page), not just clicks?",
     no:"Click counts alone won't tell you if the audience actually considered anything — set up deeper engagement tracking.",
     yes:"Good — depth metrics tell you if the content is actually landing."},
    {q:"Is there a next-step CTA (subscribe, download, retarget list) so engaged users don't just disappear?",
     no:"Engagement with no next step is a dead end — add a CTA that keeps the relationship going.",
     yes:"Good — engaged users have somewhere to go next."}
  ],
  leadgen: [
    {q:"Has this audience already run through an awareness stage (do they know the brand)?",
     no:"Cold leadgen with zero prior awareness usually has weak form-fill quality and high SDR-time-wasted. Consider a short awareness/retargeting warm-up first.",
     yes:"Good — warmer audiences convert to leads at meaningfully better rates."},
    {q:"Is there evidence of real demand (search volume, inbound interest, competitor activity)?",
     no:"If there's no demand signal, you may be trying to create demand with a leadgen format — that's an awareness job, not a leadgen job.",
     yes:"Good — leadgen budget works best against existing, provable demand."},
    {q:"Do you have a compelling enough offer to justify a form fill (not just 'contact us')?",
     no:"A weak or vague offer is the single biggest killer of B2B lead form conversion rates. Sharpen the offer before spending.",
     yes:"Good — a specific offer (audit, demo, benchmark report) converts far better than generic 'contact us'."},
    {q:"Can sales/SDR follow up on new leads within 24 hours?",
     no:"Lead value decays fast — leads not contacted within a day convert dramatically worse. Fix the follow-up SLA before scaling spend.",
     yes:"Good — fast follow-up protects the value of every lead this campaign generates."},
    {q:"Do you have a defined ICP (industry, company size, job function) to target?",
     no:"Without a defined ICP, leadgen spend will pull in a lot of unqualified fills. Define the ICP before you launch.",
     yes:"Good — a defined ICP is what keeps lead quality high."},
    {q:"Is there a lead scoring or qualification process once leads land in the CRM?",
     no:"No qualification process means sales wastes time triaging noise — even a simple scoring rule helps.",
     yes:"Good — qualification means sales time goes to the leads worth it."}
  ],
  conversion: [
    {q:"Is there a clear, low-friction path from ad click to purchase/signup?",
     no:"If the path to conversion is unclear or has too many steps, conversion campaigns will look expensive when the real problem is the funnel.",
     yes:"Good — a clean path is what conversion objectives need to actually work."},
    {q:"Has this funnel already converted leads/traffic at a known rate (even a small test)?",
     no:"Launching conversion-objective spend on an untested funnel is high risk — run a smaller retargeting/leadgen test first to validate the funnel.",
     yes:"Good — a validated funnel means the platform's conversion optimisation has something real to learn from."},
    {q:"Is conversion tracking (pixel/conversion API) correctly implemented and verified?",
     no:"Bad or missing tracking is the #1 cause of conversion campaigns looking like they fail when they're actually fine — verify this first.",
     yes:"Good — verified tracking means the platform can actually optimise toward real conversions."},
    {q:"Do you have enough historical conversion volume for the platform's algorithm to learn from (roughly 50+ conversions/month)?",
     no:"Low conversion volume starves the algorithm of signal — expect a longer, rockier learning phase.",
     yes:"Good — sufficient volume lets automated bidding actually optimise."}
  ],
  retargeting: [
    {q:"Do you have a large enough audience (pixel/list) to retarget — generally 1,000+ for stable delivery?",
     no:"Small retargeting pools deliver inconsistently and can raise costs. Consider widening the window or combining with a lookalike/similar audience.",

let state = {
  step: 0, goal: "", recPlatforms: [], recObjective: null, platforms: [], platform: null, objective: null,

const STEP_LABELS = ["Goal", "Platform", "Objective", "ICP", "Readiness", "Budget", "Format", "Playbook", "Plan", "Estimate"];
const stepsEl = document.getElementById('steps');
const panel = document.getElementById('panel');

function scoreText(text, items){
  const t = text.toLowerCase();
  return items.map(it => ({...it, score: it.keywords.reduce((s,k)=> s + (t.includes(k)?1:0), 0)}))
              .sort((a,b)=>b.score-a.score);
}

function computeRecommendations(){
  if(!state.goal || state.goal.trim().length < 3){ state.recPlatforms = []; state.recObjective = null; return; }
  const pScored = scoreText(state.goal, PLATFORMS);
  state.recPlatforms = pScored.filter(p=>p.score>0).slice(0,3).map(p=>p.id);
  const oScored = scoreText(state.goal, OBJECTIVES);
  state.recObjective = oScored[0].score > 0 ? oScored[0].id : null;
}

const PLATFORM_REASONS = {
  LinkedIn: "Its professional and company-level targeting is strongest for reaching defined B2B decision-makers.",
  TikTok: "Its native short-video environment is well suited to younger audiences, reach and fast awareness-building.",
  X: "Its real-time conversation and interest-based environment fits news, thought leadership and technical communities.",
  Google: "It captures people already searching for a solution, making it the strongest fit for high-intent demand.",
  Meta: "Its broad reach, visual formats and retargeting tools make it effective for consumer and ecommerce growth.",
  Teads: "Its premium publisher network is a strong fit for brand-safe video reach and contextual awareness.",
  Netline: "Its content syndication and intent data are designed to generate B2B leads from active researchers.",
  Microsoft: "Its enterprise audience, desktop reach and LinkedIn profile targeting are valuable for B2B search."
};

function renderGoalInsight(){
  const insight = panel.querySelector('#goalInsight');
  if(!insight) return;
  if(state.goal.trim().length < 3){
    insight.innerHTML = '';
    return;
  }
  const bestId = state.recPlatforms[0];
  if(!bestId){
    insight.innerHTML = `<div class="insight-label">Early recommendation</div><strong>Add a little more detail to sharpen the platform recommendation.</strong><div class="insight-detail">The campaign objective will unlock a more precise recommendation too.</div>`;
    return;
  }
  const platform = PLATFORMS.find(p=>p.id===bestId);
  const matchedTerms = platform.keywords.filter(keyword=>state.goal.toLowerCase().includes(keyword)).slice(0,2);
  const evidence = matchedTerms.length ? `Your brief points to ${matchedTerms.join(' and ')}.` : PLATFORM_REASONS[bestId];
  insight.innerHTML = `<div class="insight-label">Recommended starting point</div><strong>${platform.label}</strong><div class="insight-detail">${evidence} ${PLATFORM_REASONS[bestId]}</div><div class="insight-detail">Once you choose the campaign objective, I can give you more specific guidance on fit, format and expected performance.</div>`;
}

function renderSteps(){
  stepsEl.innerHTML = STEP_LABELS.map((l,i)=>{˝
    let cls = 'step-pill';
    if(i < state.step) cls += ' done';
    if(i === state.step) cls += ' active';
    return `<button class="${cls}" data-step="${i}" type="button">${i+1}. ${l}</button>`;
  }).join('');
  stepsEl.querySelectorAll('.step-pill').forEach(button=>{
    button.onclick = ()=>navigateToStage(Number(button.dataset.step));
  });
}

function goto(step){ state.step = step; render(); }

function navigateToStage(target){
  let destination = target;
  if(destination >= 2 && !state.platforms.length) destination = 1;
  if(destination >= 3 && !state.objective) destination = 2;
  if(destination >= 4 && !state.icp.industry) destination = 3;
  if(destination >= 7 && !state.format) destination = 6;
  goto(destination);
}

function render(){
  renderSteps();
  if(state.step === 0) renderGoal();
  else if(state.step === 1) renderPlatform();
  else if(state.step === 2) renderObjective();
  else if(state.step === 3) renderIcp();
  else if(state.step === 4) renderReadiness();
  else if(state.step === 5) renderBudget();
  else if(state.step === 6) renderFormatPicker();
  else if(state.step === 7) renderPlaybook();
  else if(state.step === 8) renderPlan();
  else renderEstimator();
}

  panel.innerHTML = `

    <div class="nav-row">

    </div>
  `;
  const goalInput = panel.querySelector('#goalInput');
  goalInput.oninput = ()=>{
    state.goal = goalInput.value;

  };
  panel.querySelector('#next').onclick = ()=>{
    state.goal = goalInput.value;

    <div class="rec-note">ICP captured: <strong>${Object.values(state.icp).filter(value=>Array.isArray(value) ? value.length > 0 : String(value).trim().length > 0).length}/6 audience fields</strong>. This will inform the conversion-rate assumption in the estimator. ${state.icp.exclusions.length ? `Exclusions active: ${state.icp.exclusions.join(', ')}.` : 'Add suppression audiences before launch.'}</div>
    <div id="qwrap"></div>
    <div class="readiness" id="readinessSummary" style="display:none;"></div>
    <div class="nav-row">
      <button class="btn" id="back">← Back</button>
      <button class="btn primary" id="next" disabled>Continue to budget →</button>
    </div>
  `;
  const qwrap = panel.querySelector('#qwrap');
  qs.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'qcard';
    div.innerHTML = `
      <p class="q">${item.q}</p>
      <div class="yn">
        <button data-idx="${idx}" data-val="yes">Yes</button>
        <button data-idx="${idx}" data-val="no">No</button>
      </div>
      <div class="feedback" id="fb-${idx}"></div>
    `;
    qwrap.appendChild(div);
  });
  qwrap.querySelectorAll('button[data-val]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = btn.dataset.idx, val = btn.dataset.val;
      state.answers[idx] = val;
      const card = btn.closest('.qcard');
      card.querySelectorAll('.yn button').forEach(b=>b.classList.remove('sel-yes','sel-no'));
      btn.classList.add(val==='yes' ? 'sel-yes' : 'sel-no');
      const fb = card.querySelector('.feedback');
      fb.textContent = val === 'yes' ? qs[idx].yes : qs[idx].no;
      fb.className = 'feedback show ' + (val==='yes' ? 'good' : 'warn');
      updateReadinessSummary(qs);
    };
  });
  panel.querySelector('#back').onclick = ()=>goto(3);
  panel.querySelector('#next').onclick = ()=>goto(5);
}

function updateReadinessSummary(qs){
  const answered = Object.keys(state.answers).length;
  const nextBtn = panel.querySelector('#next');
  if(answered === qs.length) nextBtn.disabled = false;
  const yesCount = Object.values(state.answers).filter(v=>v==='yes').length;
  const summary = panel.querySelector('#readinessSummary');
  if(answered > 0){
    summary.style.display = 'block';
    const pct = Math.round((yesCount/qs.length)*100);
    let verdict, color;
    if(answered < qs.length){ verdict = `${answered}/${qs.length} answered`; color='var(--sub)'; }
    else if(pct >= 75){ verdict = 'Solid foundation for this objective.'; color='var(--good)'; }
    else if(pct >= 40){ verdict = 'Workable, but address the flagged gaps to protect performance.'; color='var(--warn)'; }
    else { verdict = 'Several foundational gaps — consider fixing these (or choosing a different objective) before spending.'; color='var(--bad)'; }
    summary.innerHTML = `<div class="score" style="color:${color}">Readiness: ${yesCount}/${qs.length} yes</div>${verdict}`;
  }
}

function renderEstimator(){

  let fieldsHtml = '';
  if(est.mode === 'cpm'){
    fieldsHtml = `
      <div class="field"><label>Monthly budget (ZAR)</label><input type="number" id="budget" value="20000" min="0"></div>
      <div class="field"><label>Estimated CPM (ZAR)</label><input type="number" id="cpm" value="${est.cpm}" min="0"><div class="note">Cost per 1,000 impressions — platform/format benchmark, override with your own data if available.</div></div>

      <div class="field"><label>Landing page / form conversion rate (%)</label><input type="number" id="cvr" value="${adjustedCvr}" step="0.1" min="0"><div class="note">Starting assumption adjusted for ICP completeness (${icpCompleteness}/6 fields).</div></div>
    `;
  } else if(est.mode === 'cpc'){
    fieldsHtml = `
      <div class="field"><label>Monthly budget (ZAR)</label><input type="number" id="budget" value="20000" min="0"></div>
      <div class="field"><label>Estimated CPC (ZAR)</label><input type="number" id="cpc" value="${est.cpc}" min="0"><div class="note">Average cost per click — benchmark, override with your own account data if available.</div></div>
      <div class="field"><label>Landing page / form conversion rate (%)</label><input type="number" id="cvr" value="${adjustedCvr}" step="0.1" min="0"><div class="note">Starting assumption adjusted for ICP completeness (${icpCompleteness}/6 fields).</div></div>
    `;
  } else {
    fieldsHtml = `
      <div class="field"><label>Monthly budget (ZAR)</label><input type="number" id="budget" value="20000" min="0"></div>
      <div class="field"><label>Estimated cost per lead (ZAR)</label><input type="number" id="flatCpl" value="${est.flatCpl}" min="0"><div class="note">This channel typically sells on a cost-per-lead basis rather than impressions/clicks.</div></div>
    `;
  }
  panel.innerHTML = `
    <span class="tag">${PLATFORMS.find(p=>p.id===state.platform).label} · ${state.format}</span>
    <h2>10. Estimated CPL and quality KPIs</h2>
    <p class="hint">Defaults are directional SA B2B tech benchmarks. The ICP completeness adjusts the starting CVR assumption; replace it with account data as soon as you have enough signal.</p>
    <div class="calc-grid">
      <div>${fieldsHtml}</div>
      <div id="resultWrap"></div>
    </div>
    <div class="brief-card">
      <h3>Campaign brief ready</h3>
      <p>Export the completed strategy as a presentation for client review, internal approval or a media buying handover.</p>
      <div class="brief-meta"><span>${state.platforms.length || 1} platform${(state.platforms.length || 1) === 1 ? '' : 's'}</span><span>${state.objective ? OBJECTIVES.find(o=>o.id===state.objective).label : 'Campaign plan'}</span><span>ICP + budget + measurement included</span></div>
      <div class="nav-row" style="margin-top:14px"><span></span><button class="btn primary" id="downloadBrief">Download campaign brief (.ppt)</button></div>
    </div>
    <p class="footnote">This is a planning estimate, not a guarantee — actual CPL depends on targeting precision, creative quality, competition and offer strength. Revisit with real account data once the campaign has spent.</p>
    <div class="nav-row">
      <button class="btn" id="back">← Back</button>
      <button class="btn primary" id="restart">Start over</button>
    </div>
  `;
  const resultWrap = panel.querySelector('#resultWrap');
  function calc(){
    const budget = parseFloat(panel.querySelector('#budget').value) || 0;
    let impressions=0, clicks=0, leads=0, cpl=0;
    if(est.mode === 'cpm'){
      const cpm = parseFloat(panel.querySelector('#cpm').value) || 0;
      const ctr = parseFloat(panel.querySelector('#ctr').value) || 0;
      const cvr = parseFloat(panel.querySelector('#cvr').value) || 0;
      impressions = cpm > 0 ? (budget / cpm) * 1000 : 0;
      clicks = impressions * (ctr/100);
      leads = clicks * (cvr/100);
      cpl = leads > 0 ? budget/leads : 0;
      resultWrap.innerHTML = `
        <div class="result-box">
          <div class="lbl">Estimated CPL</div>
          <div class="big">${cpl>0 ? 'R'+cpl.toFixed(0) : '—'}</div>
          <div class="result-row"><span>Impressions</span><span>${Math.round(impressions).toLocaleString()}</span></div>
          <div class="result-row"><span>Clicks</span><span>${Math.round(clicks).toLocaleString()}</span></div>
          <div class="result-row"><span>Estimated leads</span><span>${leads>=1?Math.round(leads).toLocaleString():leads.toFixed(1)}</span></div>
        </div>
      `;
    } else if(est.mode === 'cpc'){
      const cpc = parseFloat(panel.querySelector('#cpc').value) || 0;
      const cvr = parseFloat(panel.querySelector('#cvr').value) || 0;
      clicks = cpc > 0 ? budget / cpc : 0;
      leads = clicks * (cvr/100);
      cpl = leads > 0 ? budget/leads : 0;
      resultWrap.innerHTML = `
        <div class="result-box">
          <div class="lbl">Estimated CPL</div>
          <div class="big">${cpl>0 ? 'R'+cpl.toFixed(0) : '—'}</div>
          <div class="result-row"><span>Clicks</span><span>${Math.round(clicks).toLocaleString()}</span></div>
          <div class="result-row"><span>Estimated leads</span><span>${leads>=1?Math.round(leads).toLocaleString():leads.toFixed(1)}</span></div>
        </div>
      `;
    } else {
      const flatCpl = parseFloat(panel.querySelector('#flatCpl').value) || 0;
      leads = flatCpl > 0 ? budget/flatCpl : 0;
      resultWrap.innerHTML = `
        <div class="result-box">
          <div class="lbl">Estimated CPL</div>
          <div class="big">${flatCpl>0 ? 'R'+flatCpl.toFixed(0) : '—'}</div>
          <div class="result-row"><span>Estimated leads at this budget</span><span>${leads>=1?Math.round(leads).toLocaleString():leads.toFixed(1)}</span></div>
        </div>
      `;
    }
  }
  function downloadBrief(){
    const budget = parseFloat(panel.querySelector('#budget').value) || 0;
    const cvr = panel.querySelector('#cvr') ? parseFloat(panel.querySelector('#cvr').value) || 0 : 0;
    const cplText = resultWrap.querySelector('.big') ? resultWrap.querySelector('.big').textContent : '—';
    const platforms = state.platforms.length ? state.platforms : [state.platform];
    const platformLabels = platforms.map(id=>PLATFORMS.find(p=>p.id===id).label);
    const icp = state.icp;
    const list = items => `<ul>${items.map(item=>`<li>${item}</li>`).join('')}</ul>`;
    const allocationRows = platforms.map(id=>`<tr><td>${PLATFORMS.find(p=>p.id===id).label}</td><td>${state.allocation[id] || Math.round(100/platforms.length)}%</td><td>R${Math.round(budget * (state.allocation[id] || 100/platforms.length)/100).toLocaleString()}</td></tr>`).join('');
    const campaignName = state.tracking.campaign || 'media-campaign';
    const safeName = campaignName.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'campaign-brief';
    const slide = (title, subtitle, body) => `<section class="ppt-slide"><h1>${title}</h1><h2>${subtitle}</h2>${body}</section>`;
    const presentation = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:p="urn:schemas-microsoft-com:office:powerpoint" xmlns="http://www.w3.org/TR/REC-html40">
      <head><meta charset="utf-8"><title>${campaignName} Campaign Brief</title><style>
      body{font-family:Arial,sans-serif;color:#181818;background:#fff;margin:0}.ppt-slide{page-break-after:always;padding:54px 64px;min-height:620px}h1{font-size:31px;color:#181818;margin:0 0 12px;border-bottom:4px solid #ef661f;padding-bottom:12px}h2{font-size:17px;color:#686863;margin:0 0 24px}h3{font-size:18px;color:#181818;margin:22px 0 7px}p,li,td,th{font-size:14px;line-height:1.45}ul{padding-left:23px}li{margin:7px 0}.key{background:#f4eee9;padding:15px 18px;margin:12px 0;border-left:4px solid #ef661f}.muted{color:#686863}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #dedbd4;text-align:left;padding:9px}th{color:#686863;text-transform:uppercase;font-size:11px}.footer{color:#686863;font-size:11px;margin-top:40px}</style></head><body>
      ${slide('Campaign brief', campaignName, `<div class="key"><h3>Campaign goal</h3><p>${state.goal || 'Goal not specified.'}</p></div><p class="muted">Prepared by Blacfox Media Advisor · ${new Date().toLocaleDateString('en-ZA')}</p>`)}
      ${slide('Audience and objective', 'Who we are trying to reach', `<div class="grid"><div><h3>ICP</h3>${list([`Industry: ${icp.industry || 'To be confirmed'}`,`Company size: ${icp.companySize || 'To be confirmed'}`,`Job function: ${icp.jobFunction || 'To be confirmed'}`,`Seniority: ${icp.seniority || 'To be confirmed'}`,`Geography: ${icp.geography || 'To be confirmed'}`])}</div><div><h3>Campaign objective</h3><p>${state.objective ? OBJECTIVES.find(o=>o.id===state.objective).label : 'To be confirmed'}</p><h3>Exclusions</h3><p>${icp.exclusions.length ? icp.exclusions.join(', ') : 'Suppression audiences to be confirmed'}</p></div></div>`)}
      ${slide('Channel and budget plan', 'Where the investment goes', `<p>${platformLabels.join(' + ')}</p><table><thead><tr><th>Platform</th><th>Share</th><th>Monthly budget</th></tr></thead><tbody>${allocationRows}</tbody></table><h3>Pacing</h3><p>R${budget.toLocaleString()} per month across a ${state.pacing.duration}-month flight. Average daily ceiling: R${Math.round(budget/30).toLocaleString()}.</p>`)}
      ${slide('Funnel, creative and measurement', 'How performance will be built and judged', `<h3>Funnel sequence</h3>${list(platformLabels.map((label,index)=>`Stage ${index+1}: ${label} — ${index===0 ? 'build qualified reach' : index===1 ? 'capture active intent' : 'retarget and convert'}${index < platformLabels.length-1 ? ' · timing to be confirmed' : ''}`))}<div class="grid"><div><h3>Testing</h3><p>${state.testing.variants} variants isolating the ${state.testing.isolate.toLowerCase()}. Judge only after ${state.testing.threshold || 'an agreed conversion'} minimum conversions.</p></div><div><h3>KPIs</h3><p>CTR, CPM, CVR, CPL, lead-to-MQL rate and lead-to-pipeline value. Forecast CPL: ${cplText}. Forecast CVR assumption: ${cvr}%.</p></div></div><h3>Attribution</h3><p>${state.attribution === 'multi-touch' ? 'Multi-touch influence across the journey.' : 'Single-touch credit to the final converting channel.'}</p>`)}
      ${slide('Launch governance', 'What must be ready before spend goes live', `<h3>Approval gate</h3>${list(['Brief and ICP approved','Budget and flight dates approved','Platform tracking and CRM/offline conversion path verified','POPIA consent language approved','Creative owner and turnaround confirmed','Accessibility, captions and platform safe zones checked'])}<p class="footer">Planning estimate only. Validate platform specifications, legal wording and account benchmarks before launch.</p>`)}
      </body></html>`;
    const blob = new Blob([presentation], {type:'application/vnd.ms-powerpoint'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${safeName}-campaign-brief.ppt`;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    setTimeout(()=>{ URL.revokeObjectURL(link.href); link.remove(); }, 1000);
  }
  panel.querySelectorAll('input').forEach(inp => inp.addEventListener('input', calc));
  calc();
  panel.querySelector('#downloadBrief').onclick = downloadBrief;
  panel.querySelector('#back').onclick = ()=>goto(8);
  panel.querySelector('#restart').onclick = ()=>{ location.reload(); };
}

render();
</script>
</body>
</html>
