<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blacfox Star Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
 
:root{
  --ink:#111111;
  --paper:#fbfaf7;
  --paper-line:#e2ded7;
  --navy:#171717;
  --stamp:#c94727;
  --gold:#ef661f;
  --muted:#777872;
  --white:#ffffff;
  --shadow:0 24px 70px rgba(0,0,0,.44);
}
 
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--ink);
  background-image:
    radial-gradient(circle at 15% 10%, rgba(239,102,31,0.16), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(239,102,31,0.08), transparent 40%);
  font-family:'Inter', sans-serif;
  color: var(--ink);
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding: 42px 16px 72px;
  overflow-x:hidden;
}
 
.app{ width:100%; max-width:560px; position:relative; }
 
.app::before{
  content:"";
  position:absolute;
  top:-42px;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(90deg,var(--gold),#ff9a3d,transparent 82%);
}
 
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color: var(--gold);
  margin:0 0 9px 2px;
  display:flex;
  align-items:center;
  gap:8px;
}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px rgba(239,102,31,.8);}
 
h1{
  font-family:'Space Grotesk', sans-serif;
  color:#f4f2ec;
  font-size:clamp(30px,6vw,38px);
  margin:0 0 24px 2px;
  letter-spacing:-0.035em;
  line-height:1.05;
}
 
.header-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;}
.live-badge{
  display:inline-flex;align-items:center;gap:7px;
  color:#ffd0b0;border:1px solid rgba(239,102,31,.35);background:rgba(239,102,31,.08);
  border-radius:999px;padding:7px 10px;font:600 10px 'IBM Plex Mono',monospace;
  letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
}
.live-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#5bc581;box-shadow:0 0 10px rgba(91,197,129,.9);}
 
.card{
  background: var(--paper);
  border-radius: 14px;
  padding: 30px;
  box-shadow: var(--shadow);
  position: relative;
  border: 1px solid rgba(0,0,0,0.06);
  animation: cardIn .28s ease both;
}
 
.card::before{
  content:"";
  position:absolute;
  top:0; left:28px; right:28px;
  height:0;
  border-top: 2px dashed var(--paper-line);
}
 
.screen-title{
  font-family:'Space Grotesk', sans-serif;
  font-size:22px;
  font-weight:700;
  margin: 5px 0 6px;
  color: var(--navy);
  letter-spacing:-.025em;
}
.screen-sub{
  font-size:14px;
  color:#5a615e;
  margin: 0 0 20px;
  line-height:1.45;
}
 
.btn-row{ display:flex; flex-direction:column; gap:12px; margin-top: 6px;}
 
.big-btn{
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size:16px;
  padding:18px 20px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  text-align:left;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  box-shadow:0 8px 18px rgba(28,61,74,.08);
}
.big-btn:hover{ transform: translateY(-2px); box-shadow:0 14px 26px rgba(28,61,74,.14); }
.big-btn:active{ transform: translateY(0px) scale(0.99); }
 
.big-btn.primary{ background: var(--navy); color:#fff; }
.big-btn.ghost{ background:#fff; color: var(--navy); border:1.5px solid var(--paper-line); }
.big-btn .arrow{ opacity:0.6; font-size:18px; }
 
.name-grid{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:10px;
  margin-bottom: 18px;
}
@media (min-width: 420px){
  .name-grid{ grid-template-columns: repeat(3, 1fr); }
}
 
.name-pill{
  font-family:'Inter', sans-serif;
  font-weight:500;
  font-size:14px;
  padding:14px 8px;
  border-radius:10px;
  border:1.5px solid var(--paper-line);
  background:#fff;
  color: var(--ink);
  cursor:pointer;
  text-align:center;
  transition: all .14s ease;
  box-shadow:0 3px 0 rgba(22,28,31,.03);
}
.name-pill:hover{ border-color: var(--navy); transform:translateY(-1px); box-shadow:0 8px 16px rgba(28,61,74,.1); }
.name-pill.selected{
  background: var(--navy);
  border-color: var(--navy);
  color:#fff;
}
.name-pill:disabled{
  opacity:0.35;
  cursor:not-allowed;
  text-decoration: line-through;
}
 
.name-pill.voted-tag{
  font-size:10px;
  display:block;
  margin-top:2px;
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:0.05em;
}
 
.confirm-box{
  background:#fff;
  border:1.5px solid var(--paper-line);
  border-radius:10px;
  padding:16px 18px;
  margin-bottom:18px;
  font-size:14px;
}
.confirm-box b{ color: var(--navy); }
 
.actions{ display:flex; gap:10px; }
.action-btn{
  flex:1;
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size:15px;
  padding:13px 14px;
  border-radius:9px;
  border:none;
  cursor:pointer;
  transition:transform .14s ease, box-shadow .14s ease, opacity .14s ease;
}
.action-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 9px 18px rgba(22,28,31,.12);}
.action-btn.confirm{ background: var(--stamp); color:#fff; }
.action-btn.back{ background:#fff; color:#555; border:1.5px solid var(--paper-line); }
.action-btn:disabled{ opacity:0.5; cursor:not-allowed; }
 
.link-back{
  display:inline-block;
  margin-top:16px;
  font-size:13px;
  color: var(--muted);
  cursor:pointer;
  text-decoration:underline;
}
 
/* pin entry */
.pin-input{
  width:100%;
  font-family:'IBM Plex Mono', monospace;
  font-size:24px;
  letter-spacing:0.5em;
  text-align:center;
  padding:14px 10px;
  border-radius:9px;
  border:1.5px solid var(--paper-line);
  margin-bottom:14px;
  outline:none;
}
.pin-input:focus{ border-color: var(--navy); }
.pin-error{
  color: var(--stamp);
  font-size:13px;
  margin: -6px 0 14px;
  min-height: 16px;
}
 
/* stamp receipt */
.stamp-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding: 10px 0 6px;
}
.stamp{
  width:120px; height:120px;
  border-radius:50%;
  border: 4px solid var(--stamp);
  color: var(--stamp);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Space Grotesk', sans-serif;
  font-weight:700;
  font-size:16px;
  letter-spacing:0.08em;
  transform: rotate(-12deg) scale(0.5);
  opacity:0;
  animation: stampIn .45s cubic-bezier(.2,1.6,.4,1) forwards;
  margin-bottom: 18px;
}
@keyframes stampIn{
  to{ transform: rotate(-12deg) scale(1); opacity:1; }
}
.receipt-line{
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  color:#555;
  text-align:center;
  margin: 2px 0;
}
.receipt-name{
  font-family:'Space Grotesk', sans-serif;
  font-size:19px;
  font-weight:600;
  color: var(--navy);
  text-align:center;
  margin: 6px 0 14px;
}
.voted-lobby{margin-top:6px;padding-top:18px;border-top:1px dashed var(--paper-line);}
.lobby-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;}
.lobby-title{font:700 15px 'Space Grotesk',sans-serif;color:var(--navy);}
.lobby-count{font:600 11px 'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.voted-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.voted-person{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid var(--paper-line);border-radius:9px;background:var(--white);font-size:13px;color:var(--ink);}
.voted-person::before{content:"✓";display:grid;place-items:center;width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:var(--gold);color:#fff;font:700 11px 'IBM Plex Mono',monospace;}
.voted-person.current{border-color:var(--gold);box-shadow:0 0 0 2px rgba(239,102,31,.1);}
.lobby-wait{margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.45;}
.lobby-wait strong{color:var(--navy);}
.vote-pulse{min-height:34px;display:flex;align-items:center;justify-content:center;margin:0 0 14px;padding:8px 12px;border-radius:9px;background:rgba(239,102,31,.1);border:1px solid rgba(239,102,31,.25);color:var(--navy);font:600 12px 'IBM Plex Mono',monospace;letter-spacing:.02em;opacity:0;transform:scale(.98);}
.vote-pulse.show{animation:votePulse 1.1s ease both;}
@keyframes votePulse{0%{opacity:0;transform:scale(.96)}18%{opacity:1;transform:scale(1.02)}35%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(.99)}}
@media (max-width:380px){.voted-grid{grid-template-columns:1fr;}}
 
/* host dashboard */
.stat-row{ display:flex; gap:10px; margin-bottom:18px; }
.stat{
  flex:1;
  background:#fff;
  border:1.5px solid var(--paper-line);
  border-radius:9px;
  padding:12px;
  text-align:center;
}
.stat .num{
  font-family:'IBM Plex Mono', monospace;
  font-size:22px;
  font-weight:600;
  color: var(--navy);
}
.stat .lbl{
  font-size:11px;
  color:#888;
  text-transform:uppercase;
  letter-spacing:0.06em;
}
 
.bar-row{ margin-bottom:10px; }
.bar-head{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:4px;
}
.bar-head .cnt{ font-family:'IBM Plex Mono',monospace; color:var(--muted); }
.bar-track{
  height:9px;
  background: var(--paper-line);
  border-radius:5px;
  overflow:hidden;
}
.bar-fill{
  height:100%;
  background: linear-gradient(90deg, var(--navy), var(--gold));
  border-radius:5px;
  transition: width .4s ease;
}
 
.roster-status{
  display:flex; flex-wrap:wrap; gap:6px; margin-top: 4px;
}
.status-chip{
  font-size:11px;
  font-family:'IBM Plex Mono',monospace;
  padding:4px 8px;
  border-radius:6px;
  background:#fff;
  border:1px solid var(--paper-line);
  color:#999;
}
.status-chip.signed{ color: var(--navy); border-color: var(--navy); }
.status-chip.voted{ background: var(--navy); color:#fff; border-color:var(--navy); }
 
.roster-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  border:1px solid var(--paper-line);
  border-radius:9px;
  background:#fff;
  margin-bottom:8px;
  font-size:14px;
}
.roster-remove{
  background:none;
  border:1px solid var(--stamp);
  color: var(--stamp);
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}
 
.host-danger{
  margin-top:22px;
  padding-top:16px;
  border-top: 1px dashed var(--paper-line);
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.reset-btn{
  background:none;
  border:1.5px solid var(--stamp);
  color: var(--stamp);
  font-family:'Inter',sans-serif;
  font-size:12px;
  padding:8px 12px;
  border-radius:7px;
  cursor:pointer;
}
.stop-btn{
  background: var(--stamp);
  border:none;
  color:#fff;
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;
  font-size:14px;
  padding:12px 16px;
  border-radius:9px;
  cursor:pointer;
  width:100%;
  margin-bottom:16px;
}
.stop-btn:disabled{ opacity:.4; cursor:not-allowed; }
.closed-banner{
  background:#efe6d8;
  border:1.5px solid var(--gold);
  color:#7a5c17;
  font-size:13px;
  padding:10px 14px;
  border-radius:9px;
  margin-bottom:16px;
}
 
/* countdown + winner */
.countdown-num{
  font-family:'Space Grotesk', sans-serif;
  font-size: 88px;
  font-weight:700;
  text-align:center;
  color: var(--navy);
  line-height:1;
  margin: 18px 0 8px;
}
.countdown-label{
  text-align:center;
  font-size:14px;
  color:#5a615e;
  margin-bottom: 6px;
}
 
.winner-wrap{ text-align:center; padding: 6px 0; position:relative; }
.fire-row{ font-size:34px; letter-spacing:6px; margin-bottom:6px; }
.winner-name{
  font-family:'Space Grotesk', sans-serif;
  font-size:32px;
  font-weight:700;
  color: var(--navy);
  margin: 6px 0 4px;
}
.winner-sub{
  font-size:14px;
  color:#5a615e;
  margin-bottom: 18px;
}
.confetti-piece{
  position:absolute;
  top:-10px;
  width:8px; height:14px;
  opacity:0.9;
  animation: fall linear forwards;
}
.balloon{
  position:fixed;
  left:var(--balloon-x,50%);
  bottom:-48px;
  width:28px;
  height:36px;
  border-radius:50% 50% 46% 46%;
  opacity:.92;
  animation:balloonRise linear forwards;
  z-index:20;
  pointer-events:none;
}
.balloon::before{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-top:8px solid currentColor;filter:brightness(.72);}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:110px;background:rgba(23,23,23,.3);transform-origin:top;transform:rotate(3deg);}
.ribbon-piece{position:fixed;left:var(--ribbon-x,50%);bottom:-28px;width:4px;height:42px;border-radius:4px;opacity:.9;transform-origin:bottom center;animation:ribbonRise ease-out forwards;z-index:19;pointer-events:none;}
@keyframes fall{
  to{ transform: translateY(340px) rotate(360deg); opacity:0.2; }
}
@keyframes balloonRise{0%{transform:translate3d(0,0,0) rotate(-4deg);opacity:0}12%{opacity:.92}50%{transform:translate3d(20px,-50vh,0) rotate(7deg)}100%{transform:translate3d(-18px,-125vh,0) rotate(-8deg);opacity:0}}
@keyframes ribbonRise{0%{transform:translateY(0) rotate(0) scaleY(.6);opacity:0}15%{opacity:.9}50%{transform:translateY(-52vh) rotate(75deg) scaleY(1)}100%{transform:translateY(-125vh) rotate(150deg) scaleY(.8);opacity:0}}
 
.footer-note{
  text-align:center;
  color: rgba(244,242,236,0.35);
  font-size:11px;
  font-family:'IBM Plex Mono', monospace;
  margin-top: 18px;
}
 
.vote-toast{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%) translateY(-12px);
  background: var(--navy);
  color:#fff;
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size:14px;
  padding:12px 20px;
  border-radius:999px;
  box-shadow:0 14px 30px rgba(0,0,0,.35);
  z-index:50;
  opacity:0;
  animation: toastIn .3s ease forwards;
  white-space:nowrap;
}
.vote-toast.hide{ animation: toastOut .3s ease forwards; }
@keyframes toastIn{ from{opacity:0;transform:translateX(-50%) translateY(-12px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }
@keyframes toastOut{ from{opacity:1;transform:translateX(-50%) translateY(0);} to{opacity:0;transform:translateX(-50%) translateY(-12px);} }
@media (max-width:480px){ .vote-toast{ font-size:12px; padding:10px 16px; white-space:normal; max-width:90vw; text-align:center; } }
 
button,input{font:inherit;}
button:focus-visible,input:focus-visible{outline:3px solid rgba(239,102,31,.65);outline-offset:3px;}
button:disabled{cursor:not-allowed;}
@keyframes cardIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
@media (max-width:480px){body{padding:30px 12px 48px}.app::before{top:-30px}.card{padding:24px 18px}.header-row{align-items:flex-start}.live-badge{font-size:9px;padding:6px 8px}.name-grid{gap:8px}.name-pill{font-size:13px;padding:13px 6px}}
</style>
</head>
<body>
<div class="app">
  <div class="eyebrow" id="eyebrow">BLACFOX STAR PLAYER</div>
  <div class="header-row">
    <h1 id="heading">Cast your vote</h1>
    <div class="live-badge">Live round</div>
  </div>
  <div class="card" id="card"></div>
  <div class="footer-note">Everyone's device stays in sync automatically</div>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const FALLBACK_ROSTER = ["Mtiwabo","Jaydon","Olwethu","Benita","Jerome","Amjad","Tonderai",
"Pinto","Laroche","Amilio","Marlon","Fayaadh","Indipile","Rachel",
"Rinolan","Nomonde","Malaika","Emilio","Tyrone","Stephan","Yudhveer","Payal","KG"];
let ROSTER = FALLBACK_ROSTER.slice(); // kept in sync with the 'roster' table so the host/admin can add players without editing code
 
const HOST_PIN = "2620";
const SUPER_ADMIN_PIN = "571844";
const COUNTDOWN_SECONDS = 10;
const AUTO_RESET_MS = 10 * 60 * 1000; // wipe a finished round on its own if the host never resets it
 
const card = document.getElementById('card');
const heading = document.getElementById('heading');
const eyebrow = document.getElementById('eyebrow');
 
let state = {
  screen: 'home',
  pickedVoter: null,
  me: null,
  pickedCandidate: null,
  isHost: false,
  closedAt: null,
  signedUp: false,
};
 
let pollTimer = null;      // per-screen polling (host dashboard, countdown ticking)
let watcherTimer = null;   // global watcher, always running
let lastVotingStatus = null; // used to detect when the host opens voting
 
function showVoteToast(message){
  const toast = document.createElement('div');
  toast.className = 'vote-toast';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add('hide'), 3600);
  setTimeout(() => toast.remove(), 4200);
}
 
// ---------- Supabase storage layer ----------
const supabaseClient = window.supabase.createClient(
  'https://rogeccxnirfluehzrnbr.supabase.co',
  'sb_publishable_wgxy5c3k68PQKDjwV_ux8w_o2ZA6KtR'
);
 
async function getSignups(){
  const { data, error } = await supabaseClient.from('signups').select('name');
  if(error){ console.error('getSignups error', error); return []; }
  return data.map(r => r.name);
}
 
async function getRosterNames(){
  const { data, error } = await supabaseClient.from('roster').select('name').order('created_at', { ascending: true });
  if(error){ console.error('getRosterNames error', error); return []; }
  return data.map(r => r.name);
}
 
async function addRosterName(name){
  const { error } = await supabaseClient.from('roster').upsert({ name });
  if(error) console.error('addRosterName error', error);
  return !error;
}
 
async function removeRosterName(name){
  const { error } = await supabaseClient.from('roster').delete().eq('name', name);
  if(error) console.error('removeRosterName error', error);
  return !error;
}
 
// Pulls the latest roster from the DB; keeps the hardcoded FALLBACK_ROSTER if the table is empty/unreachable
async function loadRoster(){
  const names = await getRosterNames();
  if(names.length) ROSTER = names;
}
 
async function addSignup(name){
  const { error } = await supabaseClient.from('signups').upsert({ name });
  if(error) console.error('addSignup error', error);
}
 
async function clearSignups(){
  const { error } = await supabaseClient.from('signups').delete().neq('name', '__none__');
  if(error) console.error('clearSignups error', error);
}
 
async function getVotes(){
  const { data, error } = await supabaseClient.from('votes').select('voter,candidate,created_at');
  if(error){ console.error('getVotes error', error); return {}; }
  const votes = {};
  data.forEach(r => { votes[r.voter] = { candidate: r.candidate, time: new Date(r.created_at).getTime() }; });
  return votes;
}
 
async function castVoteRow(voter, candidate){
  const { error } = await supabaseClient.from('votes').upsert({ voter, candidate });
  if(error) console.error('castVoteRow error', error);
}
 
async function clearVotes(){
  const { error } = await supabaseClient.from('votes').delete().neq('voter', '__none__');
  if(error) console.error('clearVotes error', error);
}
 
async function getVotingStatus(){
  const { data, error } = await supabaseClient
    .from('voting_status')
    .select('status,closed_at,tie_names')
    .eq('id', 1)
    .single();
  if(error || !data) return { status:'setup', closedAt:null, tieNames:[] };
  return { status:data.status, closedAt:data.closed_at, tieNames:data.tie_names || [] };
}
 
async function setVotingStatus(v){
  const { error } = await supabaseClient
    .from('voting_status')
    .update({ status:v.status, closed_at:v.closedAt, tie_names:v.tieNames || [] })
    .eq('id', 1);
  if(error) console.error('setVotingStatus error', error);
}
 
function tallyVotes(votes){
  const tally = {};
  ROSTER.forEach(n => tally[n] = 0);
  Object.values(votes).forEach(v => { if(tally[v.candidate] !== undefined) tally[v.candidate]++; });
  return tally;
}

function computeWinners(tally){
  const maxVotes = Math.max(0, ...Object.values(tally));
  const winners = maxVotes > 0 ? ROSTER.filter(name => tally[name] === maxVotes) : [];
  return { maxVotes, winners };
}

// Tallies whatever votes exist right now and publishes the result immediately, so the
// reveal never depends on any single device (host included) staying open long enough
// for a delayed timer to fire.
async function finalizeRound(closedAt){
  const votes = await getVotes();
  const tally = tallyVotes(votes);
  const { winners } = computeWinners(tally);
  await setVotingStatus({ status: winners.length > 1 ? 'tie' : 'published', closedAt, tieNames: winners });
  return winners;
}

let dismissedRoundAt = null; // closedAt of the round the host chose to 'Close' back to the dashboard
let hostGen = 0; // guards against a stale in-flight renderHost/drawHost overwriting a newer screen
async function renderHost(){
  setHeader('HOST VIEW', 'Consolidated results');
  card.innerHTML = `<div class="screen-sub">Loading live data&hellip;</div>`;
  const myGen = ++hostGen;
  const status = await getVotingStatus();
  if(myGen !== hostGen) return; // a newer render (or screen change) has since taken over
  const isFinishedRound = status.status === 'closed' || ((status.status === 'tie' || status.status === 'published') && status.closedAt !== dismissedRoundAt);
  if(isFinishedRound){
    state.closedAt = status.closedAt;
    state.screen = 'countdown';
    return render();
  }
  await drawHost();
  pollTimer = setInterval(async () => {
    const s = await getVotingStatus();
    if(myGen !== hostGen || state.screen !== 'host') return;
    const stillFinished = s.status === 'closed' || ((s.status === 'tie' || s.status === 'published') && s.closedAt !== dismissedRoundAt);
    if(stillFinished){
      stopPoll();
      state.closedAt = s.closedAt;
      state.screen = 'countdown';
      render();
      return;
    }
    drawHost();
  }, 3000);
}
 
async function drawHost(){
  const status = await getVotingStatus();
  if(state.screen !== 'host') return; // the screen moved on (e.g. voting was stopped) while this was loading
  await loadRoster(); // pick up any players the super admin just added
  if(state.screen !== 'host') return;
  const [signups, votes] = await Promise.all([getSignups(), getVotes()]);
  if(state.screen !== 'host') return;
  const tally = tallyVotes(votes);
  const totalVotes = Object.keys(votes).length;
  const maxVotes = Math.max(1, ...Object.values(tally));
  const sorted = ROSTER.slice().sort((a,b) => tally[b]-tally[a]);
 
  let bars = sorted.map(name => `
    <div class="bar-row">
      <div class="bar-head"><span>${name}</span><span class="cnt">${tally[name]}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(tally[name]/maxVotes*100)}%"></div></div>
    </div>
  `).join('');
 
  let chips = ROSTER.map(name => {
    let cls = 'status-chip';
    if(votes[name]) cls += ' voted';
    else if(signups.includes(name)) cls += ' signed';
    return `<span class="${cls}">${name}</span>`;
  }).join('');
 
  card.innerHTML = `
    <div class="screen-title">Dashboard</div>
    <div class="screen-sub">This consolidates every device's signups and votes live. Round status: <strong>${status.status === 'setup' ? 'Waiting to open' : status.status === 'open' ? 'Voting open' : status.status === 'tie' ? 'Tie announced' : status.status === 'published' ? 'Winner announced' : status.status}</strong>.</div>
    <div class="btn-row" style="margin-bottom:18px;">
      <button class="stop-btn" id="openBtn" style="margin-bottom:0;" ${status.status === 'open' || status.status === 'tie' ? 'disabled' : ''}>Open voting for everyone</button>
      <button class="stop-btn" id="stopBtn" style="margin-bottom:0;background:var(--navy);" ${status.status !== 'open' ? 'disabled' : ''}>Stop voting for everyone</button>
    </div>
    ${status.status === 'tie' ? `<button class="stop-btn" id="tieBtn">Start tie-break vote for ${status.tieNames.join(' and ')}</button>` : ''}
    <div class="stat-row">
      <div class="stat"><div class="num">${signups.length}/${ROSTER.length}</div><div class="lbl">Signed up</div></div>
      <div class="stat"><div class="num">${totalVotes}</div><div class="lbl">Votes cast</div></div>
    </div>
    <div id="bars">${bars}</div>
    <div class="screen-title" style="margin-top:18px;font-size:15px;">Team status</div>
    <div class="roster-status">${chips}</div>
    <div class="host-danger">
      <button class="reset-btn" id="resetBtn">Reset all signups &amp; votes</button>
      <span class="link-back" id="manageRosterBtn">Manage roster</span>
      <span class="link-back" id="backHome">Back to start</span>
    </div>
  `;
  document.getElementById('backHome').onclick = () => { state.screen='home'; render(); };
  document.getElementById('manageRosterBtn').onclick = () => { state.screen='superAdminPin'; render(); };
  const openBtn = document.getElementById('openBtn');
  if(openBtn) openBtn.onclick = async () => {
    if(status.status === 'open' || status.status === 'tie') return;
    await setVotingStatus({ status:'open', closedAt:null, tieNames:status.tieNames || [] });
    renderHost();
  };
  const tieBtn = document.getElementById('tieBtn');
  if(tieBtn) tieBtn.onclick = async () => {
    await clearVotes();
    await clearSignups();
    await setVotingStatus({ status:'open', closedAt:null, tieNames:status.tieNames || [] });
    renderHost();
  };
  const stopBtn = document.getElementById('stopBtn');
  if(stopBtn) stopBtn.onclick = async () => {
    if(status.status !== 'open') return;
    if(confirm('Stop voting for everyone right now? No further signups or votes will be accepted.')){
      const closedAt = Date.now();
      // finalize the tally right away instead of waiting for a later timer tick, so the
      // result doesn't depend on this device's tab/timer staying active in the background
      await finalizeRound(closedAt);
      stopPoll();
      state.closedAt = closedAt;
      state.screen = 'countdown';
      render();
    }
  };
  document.getElementById('resetBtn').onclick = async () => {
    if(confirm('This clears every signup and vote for all devices, and reopens voting. Continue?')){
      await clearSignups();
      await clearVotes();
      await setVotingStatus({ status:'setup', closedAt:null, tieNames:[] });
      drawHost();
    }
  };
}
 
// ---------- COUNTDOWN ----------
function renderCountdown(){
  setHeader('BALLOT', 'Voting has closed');
  card.innerHTML = `
    <div class="closed-banner">The host has stopped voting. Tallying the final results&hellip;</div>
    <div class="countdown-label">Results in</div>
    <div class="countdown-num" id="countNum">${COUNTDOWN_SECONDS}</div>
  `;
  const numEl = document.getElementById('countNum');
  // Any device runs this tick, so the reveal is resilient to the host's tab
  // being backgrounded or closed once results are finalized.
  const tick = async () => {
    const elapsed = Math.floor((Date.now() - state.closedAt) / 1000);
    const remaining = Math.max(0, COUNTDOWN_SECONDS - elapsed);
    numEl.textContent = remaining;
    if(remaining > 0) return;
    const status = await getVotingStatus();
    if(status.status === 'published' || status.status === 'tie'){
      stopPoll();
      state.closedAt = status.closedAt;
      state.screen = 'winner';
      return render();
    }
    // Safety net: results should already have been finalized the moment voting was
    // stopped, but if that write ever failed (or a stale 'closed' round is stuck),
    // any device can finalize once the countdown has run out.
    if(status.status === 'closed'){
      await finalizeRound(state.closedAt);
      stopPoll();
      state.screen = 'winner';
      render();
    }
  };
  tick();
  pollTimer = setInterval(tick, 300);
}
 
// ---------- WINNER ----------
let tieToastShownFor = null;
let winnerGen = 0; // guards against a stale in-flight renderWinner overwriting a newer screen
async function renderWinner(){
  const myGen = ++winnerGen;
  const status = await getVotingStatus();
  const votes = await getVotes();
  if(myGen !== winnerGen) return; // a newer render (or screen change) has since taken over
  const tally = tallyVotes(votes);
  const { winners: computedWinners } = computeWinners(tally);
  const winners = status.tieNames && status.tieNames.length ? status.tieNames : computedWinners;
  const totalVotes = Object.keys(votes).length;

  if(status.status === 'tie' && winners.length > 1){
    const tieKey = winners.slice().sort().join(',') + '|' + status.closedAt;
    if(tieToastShownFor !== tieKey){
      tieToastShownFor = tieKey;
      showVoteToast(`It's a tie between ${winners.join(' & ')}! Everyone votes again to pick the winner.`);
    }
  }
 
  let winnerBlock;
  if(winners.length === 0){
    winnerBlock = `<div class="winner-sub">No votes were cast this round.</div>`;
  } else if(winners.length === 1){
    winnerBlock = `
      <div class="winner-name">${winners[0]}</div>
      <div class="winner-sub">Congratulations!</div>
    `;
  } else {
    winnerBlock = `
      <div class="winner-name">${winners.join(' &amp; ')}</div>
      <div class="winner-sub">It's a tie between these players. Everyone will vote again to get one winner.</div>
    `;
  }
 
  setHeader('RESULTS', 'And the winner is...');
  card.innerHTML = `
    <div class="winner-wrap" id="winnerWrap">
      <div class="fire-row">&#128293; &#127881; &#128293;</div>
      ${winnerBlock}
      <div class="btn-row" style="margin-top:10px;">
        ${state.isHost ? (status.status === 'tie' ? '<button class="action-btn confirm" id="tieRoundBtn">Open tie-break vote</button>' : '<button class="reset-btn" id="newRoundBtn">Start a new round</button>') : '<span class="link-back" id="doneBtn">Waiting for the host</span>'}
        ${state.isHost ? '<span class="link-back" id="closeBtn">Close &amp; back to dashboard</span>' : ''}
      </div>
    </div>
  `;
  spawnConfetti(document.getElementById('winnerWrap'));
  spawnCelebration(document.getElementById('winnerWrap'));
  if(state.isHost){
    const closeBtn = document.getElementById('closeBtn');
    if(closeBtn) closeBtn.onclick = () => { dismissedRoundAt = status.closedAt; state.screen = 'host'; render(); };
    const tieRoundBtn = document.getElementById('tieRoundBtn');
    if(tieRoundBtn) tieRoundBtn.onclick = async () => {
      await clearVotes();
      await clearSignups();
      await setVotingStatus({ status:'open', closedAt:null, tieNames:winners });
      state.screen = 'host';
      render();
    };
    const btn = document.getElementById('newRoundBtn');
    if(btn){
      btn.onclick = async () => {
        if(confirm('Start a new round? This clears all signups and votes and reopens voting.')){
          await clearSignups();
          await clearVotes();
          await setVotingStatus({ status:'setup', closedAt:null, tieNames:[] });
          state.screen = 'host';
          render();
        }
      };
    }
  } else {
    const done = document.getElementById('doneBtn');
    if(done) done.onclick = () => { resetLocalState(false); render(); };
  }
}
 
function spawnConfetti(container){
  if(!container) return;
  const colors = ['#ef661f', '#ff9a3d', '#171717', '#ffd0b0'];
  for(let i = 0; i < 24; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random()*100 + '%';
    piece.style.background = colors[i % colors.length];
    piece.style.animationDuration = (1.2 + Math.random()*1.2) + 's';
    piece.style.animationDelay = (Math.random()*0.4) + 's';
    container.appendChild(piece);
  }
}
 
function spawnCelebration(container){
  if(!container) return;
  const colors = ['#ef661f','#ff9a3d','#171717','#c94727','#ffd0b0'];
  for(let i=0;i<10;i++){
    const balloon = document.createElement('div');
    balloon.className = 'balloon';
    balloon.setAttribute('aria-hidden','true');
    balloon.style.left = `${5 + Math.random()*90}%`;
    balloon.style.background = colors[i % colors.length];
    balloon.style.color = colors[i % colors.length];
    balloon.style.animationDuration = `${4.5 + Math.random()*2.5}s`;
    balloon.style.animationDelay = `${Math.random()*1.6}s`;
    container.appendChild(balloon);
  }
  for(let i=0;i<18;i++){
    const ribbon = document.createElement('div');
    ribbon.className = 'ribbon-piece';
    ribbon.setAttribute('aria-hidden','true');
    ribbon.style.left = `${Math.random()*100}%`;
    ribbon.style.background = colors[i % colors.length];
    ribbon.style.animationDuration = `${3.2 + Math.random()*2.4}s`;
    ribbon.style.animationDelay = `${Math.random()*1.4}s`;
    ribbon.style.transform = `rotate(${(Math.random()*30)-15}deg)`;
    container.appendChild(ribbon);
  }
}
 
// ---------- GLOBAL WATCHER ----------
// Keeps every open device in sync with the host's stop/reset actions,
// independent of whichever screen is currently rendered.
function startWatcher(){
  if(watcherTimer) clearInterval(watcherTimer);
  watcherTimer = setInterval(async () => {
    const status = await getVotingStatus();
    const closedScreens = ['home','pickVoter','confirmVoter','voteWait','vote','confirmVote','receipt','alreadyVoted'];
    const preVoteScreens = ['home','closedNotice','pickVoter','confirmVoter'];
    const eligible = state.signedUp || state.isHost;
    // a finished round that nobody acts on shouldn't stay stuck forever — any device can wipe it
    if((status.status === 'tie' || status.status === 'published') && status.closedAt && (Date.now() - status.closedAt) >= AUTO_RESET_MS){
      await clearSignups();
      await clearVotes();
      await setVotingStatus({ status:'setup', closedAt:null, tieNames:[] });
      lastVotingStatus = 'setup';
      if(!state.isHost){
        resetLocalState(false);
        showVoteToast('This round timed out after 10 minutes of inactivity \u2014 please sign up again.');
      } else if(state.screen !== 'host'){
        state.screen = 'host';
      }
      return render();
    }
    // 'closed' should only ever be momentary (stop voting finalizes instantly); if a stale
    // row is ever found in this state, any device can finalize it rather than staying stuck
    if(status.status === 'closed' && status.closedAt){
      await finalizeRound(status.closedAt);
      return;
    }
    if(status.status === 'open' && lastVotingStatus && lastVotingStatus !== 'open' && !state.isHost && preVoteScreens.includes(state.screen)){
      showVoteToast(state.me ? `${state.me}, the host has enabled you to vote!` : 'The host has enabled you to vote!');
    }
    // a host reset (manual or automatic) wipes every signup/vote, so sign every voter back out to the start screen
    if(status.status === 'setup' && lastVotingStatus && lastVotingStatus !== 'setup' && !state.isHost && state.screen !== 'home'){
      resetLocalState(false);
      showVoteToast('The round has been reset \u2014 please sign up again.');
      render();
    }
    if(status.status === 'closed' && eligible && closedScreens.includes(state.screen)){
      state.closedAt = status.closedAt;
      state.screen = 'countdown';
      render();
    } else if((status.status === 'tie' || status.status === 'published') && eligible && ['receipt','alreadyVoted'].includes(state.screen)){
      // route through the countdown screen (not straight to winner) so the reveal
      // animation always plays out, even though results are now finalized instantly
      state.closedAt = status.closedAt || Date.now();
      state.screen = 'countdown';
      render();
    } else if(status.status === 'open' && !state.isHost && (state.screen === 'countdown' || state.screen === 'winner' || state.screen === 'closedNotice')){
      resetLocalState(false);
      render();
    }
    lastVotingStatus = status.status;
  }, 2500);
}
 
(async () => {
  await loadRoster();
  lastVotingStatus = (await getVotingStatus()).status;
  render();
  startWatcher();
})();
</script>
